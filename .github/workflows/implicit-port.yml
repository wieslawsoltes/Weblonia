name: Qualify implicit composition port
on:
  push:
    branches: [feature/implicit-composition-parity]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: implicit-port-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'wieslawsoltes/Weblonia' && github.ref == 'refs/heads/feature/implicit-composition-parity'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Materialize exact reviewed source
        run: |
          python scripts/apply-implicit-edits.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add -A packages scripts tests docs samples
          if ! git diff --cached --quiet; then
            git commit -m 'feat: materialize implicit animation and server lifecycle implementation'
            git push origin HEAD:feature/implicit-composition-parity
          fi
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Exercise the new production HTTP integration first
        run: |
          npm run build
          python tests/implicit-animations-browser.py
      - name: Execute every existing and new release gate
        run: |
          mkdir -p artifacts/implicit-animations
          if ! bash scripts/qualify-core-port.sh > artifacts/implicit-animations/qualification.log 2>&1; then
            tail -160 artifacts/implicit-animations/qualification.log
            exit 1
          fi
          tail -40 artifacts/implicit-animations/qualification.log
      - name: Rebuild source manifest and archives
        run: python scripts/archive.py --output /tmp/implicit-port-release
      - name: Commit only qualified generated assets and evidence
        run: |
          git add -u
          git add -A packages samples scripts tests docs dist SOURCE-MANIFEST.json
          git add -f artifacts
          if ! git diff --cached --quiet; then
            git commit -m 'build: regenerate qualified implicit animation workers packages and evidence'
            git push origin HEAD:feature/implicit-composition-parity
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: implicit-port-qualification
          path: artifacts/
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: implicit-port-release
          path: /tmp/implicit-port-release/
