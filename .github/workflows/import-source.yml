name: Import delivered sources
on:
  push:
    branches: [main]
    paths: ['.import/READY']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and reconstruct the source delivery
        run: python3 .import/restore.py
      - run: npm run verify:vendor
      - run: npm run build
      - run: npm run verify:workers
      - run: npm test
      - run: npm run pack:all && npm run test:packages
      - name: Commit complete ordinary source and local runtime files
        run: |
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git rm -r .import
          git add -A
          git add -f dist packages/browser/worker-assets samples/ControlCatalog/compiled samples/ControlCatalog/worker
          git commit -m 'Import complete AvaloniaWeb 0.6.2 sources, default isolated catalog and Pages build'
          git push origin HEAD:main
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: import-evidence
          path: |
            docs/IMPORT.json
            artifacts/build-result.json
            artifacts/package-consumer-result.json
