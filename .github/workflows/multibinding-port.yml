name: Qualify nested MultiBinding and XAML binding graphs
on:
  push:
    branches: [feature/multibinding-xaml-parity]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: multibinding-port-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    if: github.repository == 'wieslawsoltes/Weblonia' && github.ref == 'refs/heads/feature/multibinding-xaml-parity'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Restore and commit reviewable source before qualification
        run: |
          python scripts/apply-multibinding-edits.py
          node --import ./scripts/register-loader.mjs scripts/compile-multibinding-fixture.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add -A packages scripts tests docs samples
          if ! git diff --cached --quiet; then
            git commit -m 'feat: restore complete nested MultiBinding and XAML source implementation'
            git push origin HEAD:feature/multibinding-xaml-parity
          fi
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Qualify new ordinary HTTP binding integration first
        run: |
          npm run build
          python tests/multibinding-browser.py
      - name: Run every existing and new release gate
        run: |
          mkdir -p artifacts/multibinding
          if ! bash scripts/qualify-core-port.sh > artifacts/multibinding/qualification.log 2>&1; then
            tail -160 artifacts/multibinding/qualification.log
            exit 1
          fi
          tail -40 artifacts/multibinding/qualification.log
      - name: Rebuild current source manifest and archives
        run: |
          cp docs/VERIFICATION.json dist/docs/VERIFICATION.json
          python scripts/archive.py --output /tmp/multibinding-port-release
      - name: Commit qualified generated assets and evidence
        run: |
          git add -u
          git add -A packages samples scripts tests docs dist SOURCE-MANIFEST.json
          git add -f artifacts
          git fetch origin feature/multibinding-xaml-parity
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          if ! git diff --cached --quiet; then
            git commit -m 'build: regenerate qualified MultiBinding worker assets packages and evidence'
            git push origin HEAD:feature/multibinding-xaml-parity
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: multibinding-port-qualification
          path: artifacts/
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: multibinding-port-release
          path: /tmp/multibinding-port-release/
