name: Validate JavaScript port
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python scripts/apply-multibinding-edits.py
      - run: python scripts/apply-single-binding-edits.py
      - run: python scripts/apply-glyph-edits.py
      - run: python scripts/apply-secondary-edits.py
      - run: node --import ./scripts/register-loader.mjs scripts/compile-glyph-fixture.mjs
      - run: python scripts/apply-effects-edits.py
      - run: python scripts/apply-namespace-edits.py
      - run: node --import ./scripts/register-loader.mjs scripts/compile-namespace-fixture.mjs
      - run: node --import ./scripts/register-loader.mjs scripts/compile-effects-fixture.mjs
      - run: node --import ./scripts/register-loader.mjs scripts/compile-multibinding-fixture.mjs
      - run: npm run verify:vendor
      - run: npm run test:record
      - run: npm run build
      - run: npm run verify:workers
      - run: npm run pack:all
      - run: node scripts/test-packages.mjs
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Browser test against an HTTP deployment
        shell: bash
        run: |
          node scripts/serve.mjs --dist > artifacts/http-server.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done
          python tests/browser.py --dist --url http://127.0.0.1:4173/
      - run: python tests/text-quality.py
      - run: python tests/scrollbars.py
      - run: python tests/scrollbars.py --scale 1.25
      - run: python tests/automation-incremental.py
      - run: python tests/worker-startup.py
      - run: python tests/worker-startup.py --http
      - run: python tests/pages-smoke.py
      - run: python tests/startup-http.py
      - run: python tests/threading-browser.py
      - run: python tests/threading-integration.py --http
      - run: python tests/threading-quality.py
      - run: python tests/threading-catalog.py
      - run: python tests/threading-performance.py
      - run: python tests/invalidation-browser.py
      - run: python tests/worker-performance-browser.py
      - run: python tests/core-port-browser.py
      - run: python tests/implicit-animations-browser.py
      - run: python tests/glyph-geometry-browser.py
      - run: python tests/effects-transitions-browser.py
      - run: python tests/xaml-namespaces-browser.py
      - run: python tests/multibinding-browser.py
      - run: npm run verify:release
      - run: npm run benchmark
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification
          path: artifacts/
