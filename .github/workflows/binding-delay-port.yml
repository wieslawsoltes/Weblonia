name: Qualify binding delay and source-write lifetime
on:
  push:
    branches: [feature/binding-delay-parity]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: binding-delay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    if: github.repository == 'wieslawsoltes/Weblonia' && github.ref == 'refs/heads/feature/binding-delay-parity'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Commit reviewable source before qualification
        run: |
          python scripts/apply-delay-edits.py
          node --import ./scripts/register-loader.mjs scripts/compile-delay-fixture.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add -A packages scripts tests docs samples
          git fetch origin feature/binding-delay-parity
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          if ! git diff --cached --quiet; then
            git commit -m 'feat: port binding Delay and source-write lifetime across reflection compiled XAML and workers'
            git push origin HEAD:feature/binding-delay-parity
          fi
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Qualify new ordinary HTTP integration first
        run: |
          npm run build
          python tests/binding-delay-browser.py
      - name: Execute complete release qualification
        run: |
          mkdir -p artifacts/binding-delay
          if ! bash scripts/qualify-core-port.sh > artifacts/binding-delay/qualification.log 2>&1; then
            tail -160 artifacts/binding-delay/qualification.log
            exit 1
          fi
          tail -40 artifacts/binding-delay/qualification.log
      - name: Rebuild source manifest and complete archives
        run: |
          cp docs/VERIFICATION.json dist/docs/VERIFICATION.json
          python scripts/archive.py --output /tmp/binding-delay-release
      - name: Commit qualified generated assets and evidence
        run: |
          git add -u
          git add -A packages samples scripts tests docs dist SOURCE-MANIFEST.json
          git add -f artifacts
          git fetch origin feature/binding-delay-parity
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          if ! git diff --cached --quiet; then
            git commit -m 'build: regenerate qualified binding delay worker assets packages and evidence'
            git push origin HEAD:feature/binding-delay-parity
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: binding-delay-qualification
          path: artifacts/
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: binding-delay-release
          path: /tmp/binding-delay-release/
